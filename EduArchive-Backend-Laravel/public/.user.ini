; AcadeX upload ceilings for PHP-FPM.
;
; PHP scans .user.ini from the executing script's directory up to the document
; root. public/index.php is the entry point, so this file belongs in public/.
; It only works with CGI/FastCGI SAPIs (PHP-FPM), which the production host uses.
;
; Raise these values together. post_max_size must be larger than
; upload_max_filesize to leave room for multipart boundaries and form fields.
; If the host disables per-directory user_ini.filename, copy the same values
; into /etc/php/<version>/fpm/conf.d/99-acadex-uploads.ini and restart PHP-FPM.
upload_max_filesize = 64M
post_max_size = 70M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
